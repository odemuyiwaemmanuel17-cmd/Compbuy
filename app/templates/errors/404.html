{% extends "base.html" %} {% block content %}
<div class="mx-auto max-w-lg rounded-2xl border border-slate-200 bg-white p-10 text-center">
  <p class="text-5xl font-bold text-slate-200">404</p>
  <h1 class="mt-4 text-xl font-semibold">We could not find that page</h1>
  <p class="mt-2 text-sm text-slate-500">{{ app_error or 'The listing, offer, or page you were looking for is no longer here.' }}</p>
  <div class="mt-6 flex items-center justify-center gap-3">
    <a href="/listings" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">Browse listings</a>
    <a href="/" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Go home</a>
  </div>
</div>
{% endblock %}
