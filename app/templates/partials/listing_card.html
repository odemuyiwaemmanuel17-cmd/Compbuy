<article class="group rounded-xl border border-slate-200 bg-white p-5 flex flex-col hover:border-indigo-300 hover:shadow-sm transition">
  <div class="flex items-start justify-between gap-3">
    <span class="inline-flex items-center rounded-md bg-indigo-50 px-2 py-1 text-xs font-semibold text-indigo-700">{{ listing.category_label }}</span>
    <span class="text-xs font-medium text-slate-400">{{ listing.posted_ago }}</span>
  </div>

  <h3 class="mt-3 text-base font-semibold leading-snug">
    <a href="/listings/{{ listing.id }}" class="text-slate-900 group-hover:text-indigo-700">{{ listing.title }}</a>
  </h3>
  <p class="mt-1 text-sm text-slate-500 line-clamp-2">{{ listing.summary }}</p>

  <dl class="mt-4 grid grid-cols-2 gap-2 text-sm">
    <div>
      <dt class="text-xs text-slate-400">Asking</dt>
      <dd class="font-semibold text-slate-900">{{ listing.price_display_compact }}</dd>
    </div>
    <div>
      <dt class="text-xs text-slate-400">Revenue</dt>
      <dd class="font-semibold text-slate-900">{{ listing.revenue_band_label }}</dd>
    </div>
  </dl>

  <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
    <span>{{ listing.location or 'Remote' }}</span>
    {% if saved_ids and listing.id in saved_ids %}
    <span class="inline-flex items-center gap-1 font-semibold text-amber-600">Saved</span>
    {% endif %}
  </div>
</article>
