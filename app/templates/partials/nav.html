<header class="bg-white border-b border-slate-200 sticky top-0 z-30">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-6">
    <a href="/" class="flex items-center gap-2 font-semibold text-lg tracking-tight">
      <span class="w-8 h-8 rounded-lg bg-indigo-600 text-white grid place-items-center text-sm">Cb</span>
      <span>{{ SITE_NAME }}</span>
    </a>

    <div class="hidden md:flex items-center gap-1 text-sm font-medium">
      <a href="/listings" class="px-3 py-2 rounded-lg {{ 'bg-slate-100 text-slate-900' if current_path.startswith('/listings') else 'text-slate-600 hover:text-slate-900 hover:bg-slate-50' }}">Browse</a>
      {% if current_user %}
      <a href="/seller/listings" class="px-3 py-2 rounded-lg {{ 'bg-slate-100 text-slate-900' if current_path.startswith('/seller') else 'text-slate-600 hover:text-slate-900 hover:bg-slate-50' }}">Sell</a>
      <a href="/buyer/offers" class="px-3 py-2 rounded-lg {{ 'bg-slate-100 text-slate-900' if current_path.startswith('/buyer') else 'text-slate-600 hover:text-slate-900 hover:bg-slate-50' }}">Offers</a>
      <a href="/messages" class="px-3 py-2 rounded-lg {{ 'bg-slate-100 text-slate-900' if current_path.startswith('/messages') else 'text-slate-600 hover:text-slate-900 hover:bg-slate-50' }}">Messages</a>
      {% endif %}
    </div>

    <div class="ml-auto flex items-center gap-3">
      {% if current_user %}
      <a href="/dashboard" class="hidden sm:inline-flex text-sm font-medium text-slate-600 hover:text-slate-900">Dashboard</a>
      <a href="/dashboard" class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-700 grid place-items-center text-sm font-semibold" title="{{ current_user.name }}">{{ current_user.initials }}</a>
      <form method="post" action="/auth/logout" class="inline">
        <button type="submit" class="text-sm font-medium text-slate-500 hover:text-slate-900">Sign out</button>
      </form>
      {% else %}
      <a href="/auth/login" class="text-sm font-medium text-slate-600 hover:text-slate-900">Sign in</a>
      <a href="/auth/register" class="inline-flex items-center rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">Get started</a>
      {% endif %}
    </div>
  </nav>
</header>
