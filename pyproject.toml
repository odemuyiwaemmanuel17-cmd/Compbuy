[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compbuy"
version = "1.0.0"
description = "Marketplace for buying and selling businesses. FastAPI + Supabase, server-rendered with Jinja2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "jinja2==3.1.6",
  "python-dotenv==1.2.3",
  "supabase==2.31.0",
  "itsdangerous==2.2.0",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
]

# This is an application, not a library: only the app package ships.
[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
]
